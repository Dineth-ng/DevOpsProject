services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - ./src:/var/www/html

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: university_portal
      MYSQL_USER: student
      MYSQL_PASSWORD: studentpass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
